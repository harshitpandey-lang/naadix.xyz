<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Academic Calendar | Naadix Lab</title>
  <link rel="stylesheet" href="../../../css/lab/family-dashboard/academic-calendar.css">
</head>
<body>
  <div class="shell">
    <header class="topbar"><h1>Academic Calendar</h1><span class="badge">Exams + Vacations + Dates</span></header>
    <nav class="nav-pills"><a href="home-family.html">Home</a><a href="location.html">Location</a><a class="active" href="academic-calendar.html">Academic Calendar</a><a href="../home-lab.html">Lab Home</a></nav>

    <section class="panel">
      <h3>Add Important Date</h3>
      <form id="familyDateForm" class="form-grid">
        <input id="familyDate" type="date" required>
        <input id="familyEvent" placeholder="Event" required>
        <select id="familyType"><option>Exam</option><option>Vacation</option><option>Important</option></select>
        <button type="submit">Add Date</button>
      </form>
    </section>

    <section class="panel">
      <div class="scroll-x">
        <table class="table">
          <thead><tr><th>Date</th><th>Event</th><th>Type</th><th>Source</th><th>Action</th></tr></thead>
          <tbody id="familyAcademicBody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="../../../javascript/lab/auth.js"></script>
  <script src="../../../javascript/lab/lab-common.js"></script>
  <script src="../../../javascript/lab/family-dashboard/academic-calendar.js"></script>
</body>
</html>
