<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Location | Naadix Lab</title>
  <link rel="stylesheet" href="../../../css/lab/family-dashboard/location.css">
</head>
<body>
  <div class="shell">
    <header class="topbar"><h1>Founder Location</h1><span class="badge">Real-Time Monitoring</span></header>
    <nav class="nav-pills"><a href="home-family.html">Home</a><a class="active" href="location.html">Location</a><a href="academic-calendar.html">Academic Calendar</a><a href="../home-lab.html">Lab Home</a></nav>

    <section class="card-grid">
      <article class="panel span-7">
        <h3>Live Location Map</h3>
        <iframe id="locationMap" title="Founder Map" style="width:100%;height:320px;border:1px solid #334155;border-radius:12px;"></iframe>
        <p id="locationMeta" class="mini-note">Location not available yet.</p>
        <button type="button" id="refreshLocation">Refresh Location</button>
      </article>
      <article class="panel span-5">
        <h3>Emergency Contact</h3>
        <div class="stack">
          <a id="callBtn" class="btn-link" href="tel:+910000000000">Call Founder</a>
          <a id="smsBtn" class="btn-link" href="sms:+910000000000?body=Please%20share%20your%20status">Send SMS</a>
          <button id="shareBtn" type="button">Share Message</button>
          <p class="mini-note">Last update: <span id="locationTimestamp">--</span></p>
        </div>
      </article>
    </section>
  </div>

  <script src="../../../javascript/lab/auth.js"></script>
  <script src="../../../javascript/lab/lab-common.js"></script>
  <script src="../../../javascript/lab/family-dashboard/location.js"></script>
</body>
</html>
