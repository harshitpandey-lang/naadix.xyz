<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Founder Calendar | Naadix Lab</title>
  <link rel="stylesheet" href="../../../css/lab/founder-dashboard/calendar.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <h1>Founder Calendar</h1>
      <span class="badge">Calendar + Table View</span>
    </header>
    <nav class="nav-pills">
      <a href="home-founder.html">Home</a>
      <a class="active" href="calendar.html">Calendar</a>
      <a href="vision.html">Vision</a>
      <a href="goals.html">Goals</a>
      <a href="education.html">Education</a>
      <a href="finance.html">Finance</a>
      <a href="health.html">Health</a>
      <a href="spiritual.html">Spiritual</a>
      <a href="tools.html">Tools</a>
      <a href="../home-lab.html">Lab Home</a>
    </nav>

    <section class="panel">
      <h3>Add / Edit Event</h3>
      <form id="eventForm" class="form-grid">
        <input type="hidden" id="eventId">
        <input id="eventTitle" placeholder="Event title (Exam, Meeting...)" required>
        <input id="eventDate" type="date" required>
        <input id="eventTime" type="time">
        <select id="eventCategory">
          <option value="Exam">Exam</option>
          <option value="Meeting">Meeting</option>
          <option value="Project">Project deadline</option>
          <option value="Study">Study schedule</option>
          <option value="Vacation">Vacation</option>
        </select>
        <button type="submit">Save Event</button>
      </form>
      <p class="mini-note">Use edit/delete in table view to manage existing events.</p>
    </section>

    <section class="panel">
      <div class="inline">
        <button type="button" id="prevMonth" class="secondary">Previous</button>
        <h3 id="monthLabel" style="margin:0"></h3>
        <button type="button" id="nextMonth" class="secondary">Next</button>
        <button type="button" id="toggleView">Switch to Table View</button>
      </div>
      <div id="calendarView" class="stack">
        <div class="calendar-grid" id="calendarGrid"></div>
      </div>
      <div id="tableView" class="stack" hidden>
        <div class="scroll-x">
          <table class="table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Time</th>
                <th>Event</th>
                <th>Category</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="eventTableBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

  <script src="../../../javascript/lab/auth.js"></script>
  <script src="../../../javascript/lab/lab-common.js"></script>
  <script src="../../../javascript/lab/founder-dashboard/calendar.js"></script>
</body>
</html>
