<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Education Tracker | Naadix Lab</title>
  <link rel="stylesheet" href="../../../css/lab/founder-dashboard/education.css">
</head>
<body>
  <div class="shell">
    <header class="topbar"><h1>Education</h1><span class="badge">Learning System</span></header>
    <nav class="nav-pills">
      <a href="home-founder.html">Home</a><a href="calendar.html">Calendar</a><a href="vision.html">Vision</a><a href="goals.html">Goals</a><a class="active" href="education.html">Education</a><a href="finance.html">Finance</a><a href="health.html">Health</a><a href="spiritual.html">Spiritual</a><a href="tools.html">Tools</a><a href="../home-lab.html">Lab Home</a>
    </nav>

    <section class="panel">
      <h3>Subjects</h3>
      <div id="subjectList" class="stack"></div>
      <form id="subjectForm" class="form-grid">
        <input id="subjectName" placeholder="Subject" required>
        <input id="subjectProgress" type="number" min="0" max="100" placeholder="Progress %" required>
        <input id="subjectResources" placeholder="Resources (comma separated)">
        <button type="submit">Add Subject</button>
      </form>
    </section>

    <section class="panel">
      <h3>Notes</h3>
      <textarea id="educationNotes" rows="8" placeholder="Write notes for Physics, Mathematics, Japanese, Programming, Electronics, AI..."></textarea>
    </section>
  </div>

  <script src="../../../javascript/lab/auth.js"></script>
  <script src="../../../javascript/lab/lab-common.js"></script>
  <script src="../../../javascript/lab/founder-dashboard/education.js"></script>
</body>
</html>
