<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Tracker | Naadix Lab</title>
  <link rel="stylesheet" href="../../../css/lab/founder-dashboard/finance.css">
</head>
<body>
  <div class="shell">
    <header class="topbar"><h1>Finance</h1><span class="badge">Money Dashboard</span></header>
    <nav class="nav-pills">
      <a href="home-founder.html">Home</a><a href="calendar.html">Calendar</a><a href="vision.html">Vision</a><a href="goals.html">Goals</a><a href="education.html">Education</a><a class="active" href="finance.html">Finance</a><a href="health.html">Health</a><a href="spiritual.html">Spiritual</a><a href="tools.html">Tools</a><a href="../home-lab.html">Lab Home</a>
    </nav>

    <section class="card-grid">
      <article class="panel span-12">
        <h3>Add Entry</h3>
        <form id="financeForm" class="form-grid">
          <select id="financeType">
            <option value="income">Income</option>
            <option value="expense">Expense</option>
            <option value="investment">Investment</option>
            <option value="savings">Savings</option>
          </select>
          <input id="financeAmount" type="number" min="0" placeholder="Amount" required>
          <input id="financeNote" placeholder="Note" required>
          <button type="submit">Add Entry</button>
        </form>
      </article>

      <article class="panel span-3"><h3>Income</h3><p class="kpi" id="incomeValue">Rs 0</p></article>
      <article class="panel span-3"><h3>Expenses</h3><p class="kpi" id="expenseValue">Rs 0</p></article>
      <article class="panel span-3"><h3>Savings</h3><p class="kpi" id="savingsValue">Rs 0</p></article>
      <article class="panel span-3"><h3>Investments</h3><p class="kpi" id="investmentValue">Rs 0</p></article>

      <article class="panel span-7">
        <h3>Category Distribution</h3>
        <div id="financeChart" class="chart"></div>
      </article>
      <article class="panel span-5">
        <h3>Recent Entries</h3>
        <div id="financeList" class="stack scroll-y"></div>
      </article>
    </section>
  </div>

  <script src="../../../javascript/lab/auth.js"></script>
  <script src="../../../javascript/lab/lab-common.js"></script>
  <script src="../../../javascript/lab/founder-dashboard/finance.js"></script>
</body>
</html>
