<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goals Tracker | Naadix Lab</title>
  <link rel="stylesheet" href="../../../css/lab/founder-dashboard/goals.css">
</head>
<body>
  <div class="shell">
    <header class="topbar"><h1>Goals Tracker</h1><span class="badge">Execution Meter</span></header>
    <nav class="nav-pills">
      <a href="home-founder.html">Home</a><a href="calendar.html">Calendar</a><a href="vision.html">Vision</a><a class="active" href="goals.html">Goals</a><a href="education.html">Education</a><a href="finance.html">Finance</a><a href="health.html">Health</a><a href="spiritual.html">Spiritual</a><a href="tools.html">Tools</a><a href="../home-lab.html">Lab Home</a>
    </nav>

    <section class="panel">
      <h3>Add Goal</h3>
      <form id="goalForm" class="form-grid">
        <input id="goalTitle" placeholder="Goal title" required>
        <input id="goalDeadline" type="date" required>
        <input id="goalProgress" type="number" min="0" max="100" placeholder="Progress %" required>
        <input id="goalDescription" placeholder="Short description" required>
        <button type="submit">Save Goal</button>
      </form>
    </section>

    <section class="panel">
      <h3>Goal Progress</h3>
      <div id="goalList" class="stack"></div>
    </section>
  </div>

  <script src="../../../javascript/lab/auth.js"></script>
  <script src="../../../javascript/lab/lab-common.js"></script>
  <script src="../../../javascript/lab/founder-dashboard/goals.js"></script>
</body>
</html>
