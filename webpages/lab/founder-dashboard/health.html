<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Tracker | Naadix Lab</title>
  <link rel="stylesheet" href="../../../css/lab/founder-dashboard/health.css">
</head>
<body>
  <div class="shell">
    <header class="topbar"><h1>Health Tracker</h1><span class="badge">Habits + Progress</span></header>
    <nav class="nav-pills">
      <a href="home-founder.html">Home</a><a href="calendar.html">Calendar</a><a href="vision.html">Vision</a><a href="goals.html">Goals</a><a href="education.html">Education</a><a href="finance.html">Finance</a><a class="active" href="health.html">Health</a><a href="spiritual.html">Spiritual</a><a href="tools.html">Tools</a><a href="../home-lab.html">Lab Home</a>
    </nav>

    <section class="card-grid">
      <article class="panel span-6">
        <h3>Daily Habits</h3>
        <form id="healthForm" class="stack">
          <label><input type="checkbox" value="sleep"> Sleep (7h+)</label>
          <label><input type="checkbox" value="exercise"> Exercise</label>
          <label><input type="checkbox" value="meditation"> Meditation</label>
          <label><input type="checkbox" value="diet"> Diet discipline</label>
        </form>
      </article>
      <article class="panel span-6">
        <h3>Progress</h3>
        <p class="kpi" id="healthScore">0%</p>
        <div id="healthChart" class="chart"></div>
      </article>
    </section>
  </div>

  <script src="../../../javascript/lab/auth.js"></script>
  <script src="../../../javascript/lab/lab-common.js"></script>
  <script src="../../../javascript/lab/founder-dashboard/health.js"></script>
</body>
</html>
