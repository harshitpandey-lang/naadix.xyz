<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Founder Tools | Naadix Lab</title>
  <link rel="stylesheet" href="../../../css/lab/founder-dashboard/tools.css">
</head>
<body>
  <div class="shell">
    <header class="topbar"><h1>Tools</h1><span class="badge">Productivity Kit</span></header>
    <nav class="nav-pills">
      <a href="home-founder.html">Home</a><a href="calendar.html">Calendar</a><a href="vision.html">Vision</a><a href="goals.html">Goals</a><a href="education.html">Education</a><a href="finance.html">Finance</a><a href="health.html">Health</a><a href="spiritual.html">Spiritual</a><a class="active" href="tools.html">Tools</a><a href="../home-lab.html">Lab Home</a>
    </nav>

    <section class="card-grid">
      <article class="panel span-4">
        <h3>Pomodoro Timer</h3>
        <p class="kpi" id="timerLabel">25:00</p>
        <div class="inline">
          <button id="startTimer" type="button">Start</button>
          <button id="resetTimer" class="secondary" type="button">Reset</button>
        </div>
      </article>

      <article class="panel span-4">
        <h3>Quick Notes</h3>
        <textarea id="quickNote" rows="7" placeholder="Capture fast ideas..."></textarea>
      </article>

      <article class="panel span-4">
        <h3>Calculator</h3>
        <div class="form-grid">
          <input id="calcA" type="number" placeholder="A">
          <select id="calcOp"><option>+</option><option>-</option><option>*</option><option>/</option></select>
          <input id="calcB" type="number" placeholder="B">
          <button id="calcRun" type="button">Calculate</button>
        </div>
        <p class="mini-note" id="calcOut">Result: --</p>
      </article>

      <article class="panel span-12">
        <h3>Quick Links</h3>
        <div class="chips">
          <a class="chip" href="https://github.com" target="_blank" rel="noreferrer">GitHub</a>
          <a class="chip" href="https://calendar.google.com" target="_blank" rel="noreferrer">Google Calendar</a>
          <a class="chip" href="https://www.notion.so" target="_blank" rel="noreferrer">Notion</a>
          <a class="chip" href="https://docs.google.com" target="_blank" rel="noreferrer">Google Docs</a>
        </div>
      </article>
    </section>
  </div>

  <script src="../../../javascript/lab/auth.js"></script>
  <script src="../../../javascript/lab/lab-common.js"></script>
  <script src="../../../javascript/lab/founder-dashboard/tools.js"></script>
</body>
</html>
