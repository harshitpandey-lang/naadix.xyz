<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vision Board | Naadix Lab</title>
  <link rel="stylesheet" href="../../../css/lab/founder-dashboard/vision.css">
</head>
<body>
  <div class="shell">
    <header class="topbar"><h1>Vision Board</h1><span class="badge">Long-Term Focus</span></header>
    <nav class="nav-pills">
      <a href="home-founder.html">Home</a><a href="calendar.html">Calendar</a><a class="active" href="vision.html">Vision</a><a href="goals.html">Goals</a><a href="education.html">Education</a><a href="finance.html">Finance</a><a href="health.html">Health</a><a href="spiritual.html">Spiritual</a><a href="tools.html">Tools</a><a href="../home-lab.html">Lab Home</a>
    </nav>

    <section class="card-grid">
      <article class="panel span-5">
        <h3>Add Vision Item</h3>
        <form id="visionForm" class="stack">
          <input id="visionTitle" placeholder="Goal title" required>
          <input id="visionImage" placeholder="Image URL (optional)">
          <textarea id="visionNotes" rows="4" placeholder="Notes / why this matters"></textarea>
          <button type="submit">Add to Vision Board</button>
        </form>
      </article>
      <article class="panel span-7">
        <h3>Mission Statement</h3>
        <textarea id="missionText" rows="4" placeholder="Build Naadix AI platform and robotics lab with impact-driven education."></textarea>
        <p class="mini-note">Auto-saved.</p>
      </article>
      <article class="panel span-12">
        <h3>Vision Items</h3>
        <div id="visionList" class="gallery"></div>
      </article>
    </section>
  </div>

  <script src="../../../javascript/lab/auth.js"></script>
  <script src="../../../javascript/lab/lab-common.js"></script>
  <script src="../../../javascript/lab/founder-dashboard/vision.js"></script>
</body>
</html>
